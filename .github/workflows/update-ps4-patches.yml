name: Update PS4 patches

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ps4-patches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: cachix/install-nix-action@v31

      - name: Restore kernel history
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ps4-linux.git
          key: ps4-linux-history-v1-${{ github.run_id }}
          restore-keys: |
            ps4-linux-history-v1-

      - name: Test patch exporter
        run: bash export-ps4-patches/tests/export-ps4-patches.sh

      - name: Export patches
        run: |
          bash export-ps4-patches/export-ps4-patches.sh \
            --repo "$RUNNER_TEMP/ps4-linux.git" \
            --output "$RUNNER_TEMP/ps4-patches"

      - name: Stage generated patches
        id: patches
        run: |
          mkdir -p ps4-patches
          rsync -a --delete "$RUNNER_TEMP/ps4-patches/" ps4-patches/
          git add -- ps4-patches
          if git diff --cached --quiet -- ps4-patches; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate patch application
        if: steps.patches.outputs.changed == 'true'
        run: nix flake check --no-update-lock-file -L

      - name: Validate ThinLTO configuration and build
        if: steps.patches.outputs.changed == 'true'
        run: nix build .#linux-ps4-thinlto --no-update-lock-file --no-link --cores 2 --max-jobs 1 -L

      - name: Commit generated patches
        if: steps.patches.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "Update PS4 kernel patches" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push
